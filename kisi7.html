<!DOCTYPE html>

<head>

    <title>KISI-KISI PTS Informatika Kelas VII</title>

<body oncontextmenu="return false;" onkeydown="return disableShortcuts(event);">

<div class="container">
    <div class="header">
        <h1>SMP REMAJA PLUIT</h1>
        <h2>KISI-KISI PTS INFORMATIKA</h2>
        <h3>Kelas: VII | Pembuat Soal: Yogga Hadi Sutisna, A.Md</h3>
    </div>

    <div id="quiz-body">
        <div class="progress" id="progress-text">Soal 1 dari 25</div>
        <div class="question-box">
            <div class="question-title" id="question-text"></div>
            <ul class="options" id="options-container"></ul>
        </div>
        <div class="nav-buttons">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Sebelumnya</button>
            <button id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
        </div>
    </div>

    <div id="result-body" class="result-box" style="display: none;">
        <h2>Kuis Selesai!</h2>
        <p>Skor Akhir Anda:</p>

        <p id="score-summary"></p>
        <br>
        <button onclick="location.reload()">Ulangi Kuis</button>
    </div>

<script>
// Mencegah Tombol Klik Kanan & Shortcut Keyboard (Inspect Element, Copy, Paste)
function disableShortcuts(e) {
    if (e.keyCode === 123 || 
       (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
       (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67))) {
        return false;
    }
}

// Data Seluruh Soal Pilihan Ganda (Termasuk 5 soal essai yang diubah ke PG)
const rawQuestions = [

        ans: "data dan informasi"
    },
    {
        q: "Tujuan informatika yaitu membentuk sebuah sistem komputasu yang di dalamnya terdapat ... untuk menyelesaikan masalah.",

    },
    {
        q: "Aspek-aspek yang ada pada informasi antara lain",

    {

    },
    {

    },
    {
        q: "Berikut merupakan kompetensi dari lulusan (SI)\n1. pemahaman dalam pengembangan dan juga maitenance sistem informasi\n2. pengembangan sistem informasi\n3. implementasi dan pembuatan sistem informasi\n4. memahami letak geografis suatu wilayah",
        opts: ["1,2", "1,3,4", "3,4", "1,2,3"],
        ans: "1,2,3"
    },
    {
        q: "komponen yang biasa dimiliki oleh lulusan Teknik Informatika (TI) yaitu ...\n1. desian grafis dan desian program serta desain web\n2. program\n3. pengembangan dan pembuatan aplikasi atau software\n4. perangkat mesin pabrik dan alat berat",
        opts: ["1,2", "1,2,3", "1,2,3,4", "2,3,4"],
        ans: "1,2,3"
    },
    {
        q: "apa sajakah manfaat teknologi bagi siswa ?\n1. komunikasi semakin mudah\n2. sumber informasi\n3. jejaring sosial\n4. membangkitkan semangat kerja",
        opts: ["1,2", "1,2,3", "1,2,3,4", "2,3,4"],
        ans: "1,2,3"
    },
    {
        q: "Belajar semakin mudah, tukar pikiran, mendapat bahan dan ujian secara online merupakan salah satu manfaat teknologi digital untuk pendidikan siswa, yaitu\n1. jejaring sosial\n2. bangun kreativitas\n3. pembelajaran jarak jauh\n4. sumber informasi",
        opts: ["1,2", "1,2,3", "1,2,3,4", "2,3,4"],
        ans: "1,2,3,4"
    },
    {
        q: "Microsoft PowerPoint digunakan untuk membuat",
        opts: ["Dokumen teks", "Presentasi", "Perhitungan angka", "Database"],

    },
    {

    },
    {

        ans: "F5"

    {

        ans: "Animation"
    },
    {

    },
    {

    },
    {
        q: "Baris pada Microsoft Excel ditandai dengan",
        opts: ["Huruf", "Angka", "Simbol", "Rumus"],

    },
    {
        q: "Rumus pada Microsoft Excel selalu diawali dengan tanda",
        opts: ["+", "-", "=", ":"],
        ans: "="
    },

    // --- 5 Soal Essai yang Dikonversi Menjadi Pilihan Ganda ---
    {
        q: "Pengertian Microsoft PowerPoint beserta kegunaan utamanya yang paling tepat adalah ....",
        opts: [
            "Aplikasi pembuat presentasi untuk menyampaikan informasi secara visual menggunakan slide",
            "Aplikasi pemroses kata untuk mengetik surat dan dokumen resmi",

            "Program pembuat database jaringan berbasis cloud"

    },
    {

        opts: [
            "Klik tab Home -> pilih New Slide",
            "Klik tab View -> pilih Zoom",
            "Klik tab Insert -> pilih Chart",
            "Klik File -> pilih Save As"
        ],
        ans: "Klik tab Home -> pilih New Slide"
    },

        opts: [
            "Animation digunakan untuk efek pada objek di dalam slide, sedangkan Transition untuk efek perpindahan antar slide",
            "Animation untuk efek perpindahan slide, sedangkan Transition untuk efek pada teks",
            "Animation untuk mengatur tata letak slide, sedangkan Transition untuk mengubah warna latar",
            "Tidak ada perbedaan, keduanya berfungsi sama persis"

    },
    {

        opts: [
            "Row berbentuk horizontal (angka), Column berbentuk vertikal (huruf), dan Cell adalah pertemuan row & column",
            "Row berbentuk vertikal (huruf), Column berbentuk horizontal (angka), dan Cell adalah lembar kerja",
            "Row adalah rumus matematika, Column adalah nama dokumen, dan Cell adalah grafik",
            "Row dan Column adalah sama, sedangkan Cell adalah kumpulan tombol toolbar"
        ],
        ans: "Row berbentuk horizontal (angka), Column berbentuk vertikal (huruf), dan Cell adalah pertemuan row & column"
    },
    {
        q: "Langkah-langkah yang benar untuk menyimpan dokumen pada Microsoft Word adalah ....",
        opts: [
            "Klik menu File -> Save As -> Pilih lokasi -> Ketik nama file -> Klik Save",
            "Klik Insert -> Table -> Ketik nama file -> Klik OK",
            "Tekan tombol Alt + F4 -> Matikan komputer",
            "Klik Home -> Cut -> Simpan ke folder"
        ],
        ans: "Klik menu File -> Save As -> Pilih lokasi -> Ketik nama file -> Klik Save"
    }
];

let questions = [];
let currentIndex = 0;
let userAnswers = {};

// Fungsi Acak Array (Fisher-Yates Shuffle)
function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Inisialisasi Kuis (Mengacak Soal & Opsi Jawaban)
function initQuiz() {
    let shuffledQ = shuffle(rawQuestions);
    questions = shuffledQ.map(qObj => {
        return {
            q: qObj.q,
            opts: shuffle(qObj.opts), // Acak opsi A, B, C, D
            ans: qObj.ans
        };
    });
    showQuestion();
}

// Tampilkan Soal
function showQuestion() {
    const q = questions[currentIndex];
    document.getElementById("progress-text").innerText = `Soal ${currentIndex + 1} dari ${questions.length}`;
    document.getElementById("question-text").innerText = `${currentIndex + 1}. ${q.q}`;

    const optsContainer = document.getElementById("options-container");
    optsContainer.innerHTML = "";

    const labels = ['A', 'B', 'C', 'D'];
    q.opts.forEach((opt, idx) => {
        const isChecked = userAnswers[currentIndex] === opt ? "checked" : "";
        optsContainer.innerHTML += `
            <li>
                <label>
                    <input type="radio" name="option" value="${opt}" ${isChecked} onchange="saveAnswer('${opt}')">
                    <b>${labels[idx]}.</b> ${opt}
                </label>
            </li>
        `;
    });

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    
    if (currentIndex === questions.length - 1) {
        document.getElementById("next-btn").innerText = "Selesai & Lihat Skor";
    } else {
        document.getElementById("next-btn").innerText = "Selanjutnya";
    }
}

// Simpan Jawaban
function saveAnswer(selectedOpt) {
    userAnswers[currentIndex] = selectedOpt;
}

// Navigasi Selanjutnya
function nextQuestion() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        showQuestion();
    } else {
        calculateScore();
    }
}

// Navigasi Sebelumnya
function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        showQuestion();
    }
}

// Hitung Skor Akhir
function calculateScore() {
    let correctCount = 0;

    questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.ans) {
            correctCount++;
        }
    });

    const score = Math.round((correctCount / questions.length) * 100);

    document.getElementById("quiz-body").style.display = "none";
    document.getElementById("result-body").style.display = "block";
    document.getElementById("final-score").innerText = score;
    document.getElementById("score-summary").innerText = `Anda menjawab benar ${correctCount} dari ${questions.length} soal.`;
}

// Jalankan Kuis saat Halaman Dimuat
document.addEventListener("DOMContentLoaded", initQuiz);
</script>
