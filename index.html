<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisi-Kisi Informatika - SMP Remaja Pluit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 650px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            color: #1a252f;
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .header h2 {
            color: #007bff;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .header p {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-class-7 {
            background: linear-gradient(135deg, #28a745, #218838);
        }
        .btn-class-8 {
            background: linear-gradient(135deg, #007bff, #0056b3);
        }
        .btn-class-9 {
            background: linear-gradient(135deg, #6f42c1, #5a32a3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .btn .arrow {
            font-size: 20px;
        }
        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>SMP REMAJA PLUIT</h1>
        <h2>Kisi-Kisi PTS Informatika</h2>
        <p>Guru Pengampu: Yogga Hadi Sutisna, S.Kom</p>
    </div>

    <div class="button-group">
        <a href="kisi7.html" class="btn btn-class-7">
            <span>📚 Kisi-Kisi PTS Kelas VII</span>
            <span class="arrow">➔</span>
        </a>
        <a href="kisi8.html" class="btn btn-class-8">
            <span>📚 Kisi-Kisi PTS Kelas VIII</span>
            <span class="arrow">➔</span>
        </a>
        <a href="kisi9.html" class="btn btn-class-9">
            <span>📚 Kisi-Kisi PTS Kelas IX</span>
            <span class="arrow">➔</span>
        </a>
    </div>

    <div class="footer">
        &copy; SMP Remaja Pluit - Informatika
    </div>
</div>

</body>
</html>
